<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartCricket AI: All players</title>
  <link rel="stylesheet" href="css/style.css?v=48">
  <link rel="stylesheet" href="css/players.css?v=1">
</head>
<body>
  <div class="layout">
    <main class="players-page">
      <div class="page-head">
        <div><h1>All players</h1><p class="muted">Practice, progress and player activity.</p></div>
        <label class="players-search"><span id="sico" aria-hidden="true"></span>
          <input class="plain" id="search" type="search" placeholder="Search players" aria-label="Search players" disabled>
        </label>
      </div>

      <div class="pl-chips" id="chips"></div>
      <div class="card players-status" id="players-status" role="status" aria-live="polite">Loading players…</div>

      <section class="card players-roster" id="players-roster" aria-labelledby="roster-title" hidden>
        <div class="players-roster-head"><div><span class="eyebrow-s">Roster</span><h2 id="roster-title">Players</h2></div><span class="muted small">Select a player to view details</span></div>
        <div class="players-table-scroll" role="region" aria-label="Player roster; scroll horizontally for more columns" tabindex="0">
        <table class="data ptable players-table">
          <colgroup><col class="col-player"><col class="col-analyses"><col class="col-active"><col class="col-level"><col class="col-streak"><col class="col-plan"><col class="col-visible"><col class="col-shot"></colgroup>
          <thead><tr>
            <th scope="col" aria-sort="none"><button type="button" data-sort="name">Player <span class="sort-arrow"></span></button></th>
            <th scope="col" aria-sort="descending"><button type="button" data-sort="analyses">Analyses <span class="sort-arrow">↓</span></button></th>
            <th scope="col" aria-sort="none"><button type="button" data-sort="last_active">Last active <span class="sort-arrow"></span></button></th>
            <th scope="col" aria-sort="none"><button type="button" data-sort="level">Level <span class="sort-arrow"></span></button></th>
            <th scope="col" aria-sort="none"><button type="button" data-sort="streak">Streak <span class="sort-arrow"></span></button></th>
            <th scope="col" aria-sort="none"><button type="button" data-sort="plan_pct">Plan · 7d <span class="sort-arrow"></span></button></th>
            <th scope="col" aria-sort="none"><button type="button" data-sort="avg_visible">Visibility <span class="sort-arrow"></span></button></th><th scope="col">Top shot</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
        </div>
      </section>
    </main>
  </div>
  <dialog id="player-sheet" class="player-sheet" aria-labelledby="sheet-title" aria-describedby="sheet-email">
    <div class="player-sheet-head"><span class="eyebrow-s">Player details</span><button type="button" id="sheet-close" class="player-sheet-close" aria-label="Close player details" autofocus>×</button></div>
    <div class="player-sheet-body" id="sheet-body"></div>
  </dialog>
  <script src="js/dropdown.js?v=1"></script>
  <script src="js/api.js?v=48"></script>
  <script src="js/player-streaks.js?v=1"></script>
  <script src="js/players.js?v=1"></script>
</body>
</html>
